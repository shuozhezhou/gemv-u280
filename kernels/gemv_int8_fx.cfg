# v++ link configuration for the L3b INT8 fixed-point-accumulator kernel (same banks as gemv_int8;
# y has its own AXI port gmem3, so the reading and the writing dataflow process
# do not share one).
[connectivity]
nk=gemv_int8_fx:1:gemv_int8_fx_1
sp=gemv_int8_fx_1.Wq:HBM[0]
sp=gemv_int8_fx_1.s:HBM[1]
sp=gemv_int8_fx_1.xq:HBM[2]
sp=gemv_int8_fx_1.y:HBM[2]
