# v++ link configuration for the L3d batched INT8 kernel (one CU).
# Wq -> HBM[0], s -> HBM[1], xq / sxv / y -> HBM[2] (same banks as gemv_int8_ps).
[connectivity]
nk=gemv_int8_ps_b:1:gemv_int8_ps_b_1
sp=gemv_int8_ps_b_1.Wq:HBM[0]
sp=gemv_int8_ps_b_1.s:HBM[1]
sp=gemv_int8_ps_b_1.xq:HBM[2]
sp=gemv_int8_ps_b_1.sxv:HBM[2]
sp=gemv_int8_ps_b_1.y:HBM[2]
