# Batched INT8 kernel, weights spread over 3 pseudo-channels of one HBM switch (768 MB, for Qwen3-0.6B).
# Wq -> HBM[0:2], s / xq / sxv / y -> HBM[3] (all four PCs behind the same switch).
[connectivity]
nk=gemv_int8_ps_b:1:gemv_int8_ps_b_1
sp=gemv_int8_ps_b_1.Wq:HBM[0:2]
sp=gemv_int8_ps_b_1.s:HBM[3]
sp=gemv_int8_ps_b_1.xq:HBM[3]
sp=gemv_int8_ps_b_1.sxv:HBM[3]
sp=gemv_int8_ps_b_1.y:HBM[3]
