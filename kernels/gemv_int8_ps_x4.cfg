# v++ link configuration: 4 compute units of gemv_int8_ps (multi-HBM scaling).
# CU i (1..4): Wq -> HBM[2(i-1)] (its own pseudo-channel and memory controller),
# s, xq, y -> HBM[2(i-1)+1]. All CUs in SLR0, next to the HBM.
# Measured on the board: CU3/CU4 contend. v++ connects CU i's 4 AXI ports to
# hmss_0 S(4i-3)..S(4i) (next to PCs 4(i-1)..4i-1), so CU3 (HBM[4],[5]) and CU4
# (HBM[6],[7]) both cross the switch to the PC 4-7 group. Use gemv_int8_ps_x4_aligned.cfg.
[connectivity]
nk=gemv_int8_ps:4:gemv_int8_ps_1.gemv_int8_ps_2.gemv_int8_ps_3.gemv_int8_ps_4
sp=gemv_int8_ps_1.Wq:HBM[0]
sp=gemv_int8_ps_1.s:HBM[1]
sp=gemv_int8_ps_1.xq:HBM[1]
sp=gemv_int8_ps_1.y:HBM[1]
sp=gemv_int8_ps_2.Wq:HBM[2]
sp=gemv_int8_ps_2.s:HBM[3]
sp=gemv_int8_ps_2.xq:HBM[3]
sp=gemv_int8_ps_2.y:HBM[3]
sp=gemv_int8_ps_3.Wq:HBM[4]
sp=gemv_int8_ps_3.s:HBM[5]
sp=gemv_int8_ps_3.xq:HBM[5]
sp=gemv_int8_ps_3.y:HBM[5]
sp=gemv_int8_ps_4.Wq:HBM[6]
sp=gemv_int8_ps_4.s:HBM[7]
sp=gemv_int8_ps_4.xq:HBM[7]
sp=gemv_int8_ps_4.y:HBM[7]
slr=gemv_int8_ps_1:SLR0
slr=gemv_int8_ps_2:SLR0
slr=gemv_int8_ps_3:SLR0
slr=gemv_int8_ps_4:SLR0
