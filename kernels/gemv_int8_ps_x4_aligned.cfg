# v++ link configuration: 4 compute units of gemv_int8_ps, HBM-switch aligned.
# v++ connects the 4 AXI ports of CU i (gmem0..3, in CU order) to hmss_0 S(4i-3)..S(4i),
# which sit at HBM switch i, next to pseudo-channels 4(i-1)..4(i-1)+3. So CU i uses only
# banks of that switch: Wq -> HBM[4(i-1)], s/xq/y -> HBM[4(i-1)+1] (no lateral traffic).
[connectivity]
nk=gemv_int8_ps:4:gemv_int8_ps_1.gemv_int8_ps_2.gemv_int8_ps_3.gemv_int8_ps_4
sp=gemv_int8_ps_1.Wq:HBM[0]
sp=gemv_int8_ps_1.s:HBM[1]
sp=gemv_int8_ps_1.xq:HBM[1]
sp=gemv_int8_ps_1.y:HBM[1]
sp=gemv_int8_ps_2.Wq:HBM[4]
sp=gemv_int8_ps_2.s:HBM[5]
sp=gemv_int8_ps_2.xq:HBM[5]
sp=gemv_int8_ps_2.y:HBM[5]
sp=gemv_int8_ps_3.Wq:HBM[8]
sp=gemv_int8_ps_3.s:HBM[9]
sp=gemv_int8_ps_3.xq:HBM[9]
sp=gemv_int8_ps_3.y:HBM[9]
sp=gemv_int8_ps_4.Wq:HBM[12]
sp=gemv_int8_ps_4.s:HBM[13]
sp=gemv_int8_ps_4.xq:HBM[13]
sp=gemv_int8_ps_4.y:HBM[13]
slr=gemv_int8_ps_1:SLR0
slr=gemv_int8_ps_2:SLR0
slr=gemv_int8_ps_3:SLR0
slr=gemv_int8_ps_4:SLR0
