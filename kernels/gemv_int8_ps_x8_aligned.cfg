# v++ link configuration: 8 compute units of gemv_int8_ps, HBM-switch aligned.
# v++ connects the 4 AXI ports of CU i (gmem0..3, in CU order) to hmss_0 S(4i-3)..S(4i),
# which sit at HBM switch i, next to pseudo-channels 4(i-1)..4(i-1)+3. So CU i uses only
# banks of that switch: Wq -> HBM[4(i-1)], s/xq/y -> HBM[4(i-1)+1] (no lateral traffic).
[connectivity]
nk=gemv_int8_ps:8:gemv_int8_ps_1.gemv_int8_ps_2.gemv_int8_ps_3.gemv_int8_ps_4.gemv_int8_ps_5.gemv_int8_ps_6.gemv_int8_ps_7.gemv_int8_ps_8
